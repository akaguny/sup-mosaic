<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>SUP-мозаика · документация</title>
<link rel="icon" href="data:,">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Onest:wght@400;500;600;700&family=Unbounded:wght@600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: оглавление слева (на телефоне — сверху), документ справа, колонка текста ~70 знаков. Палитра и шрифты — как у приложения. */
:root{
  --bg:#EEF3F4; --panel:#FFFFFF; --ink:#11262E; --muted:#5A7078; --line:#CFDADD;
  --accent:#087F9E; --accent-ink:#FFFFFF; --soft:#DDEBEE; --code:#E6EFF1; --bead:#F2B33D;
  --display:"Unbounded","Onest",system-ui,sans-serif; --body:"Onest",system-ui,-apple-system,"Segoe UI",sans-serif;
  --mono:"JetBrains Mono",ui-monospace,Menlo,Consolas,monospace;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0E1A1F; --panel:#16262C; --ink:#E4EEF0; --muted:#93A8AF; --line:#2B4048;
  --accent:#3DB6D3; --accent-ink:#06222B; --soft:#1F353D; --code:#1B2E35; --bead:#E8A93A; color-scheme:dark } }
:root[data-theme="dark"]{
  --bg:#0E1A1F; --panel:#16262C; --ink:#E4EEF0; --muted:#93A8AF; --line:#2B4048;
  --accent:#3DB6D3; --accent-ink:#06222B; --soft:#1F353D; --code:#1B2E35; --bead:#E8A93A; color-scheme:dark }
*{box-sizing:border-box}
html{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 var(--body)}
.wrap{max-width:1180px;margin:0 auto;padding-inline:16px;padding-block:20px 48px;display:grid;grid-template-columns:250px minmax(0,1fr);gap:24px;align-items:start}
@media (max-width:820px){.wrap{grid-template-columns:minmax(0,1fr)}}
nav{position:sticky;top:calc(env(safe-area-inset-top,0px) + 16px);display:flex;flex-direction:column;gap:14px;min-width:0}
@media (max-width:820px){nav{position:static}.group{flex-direction:row;flex-wrap:wrap;gap:4px}.group h2{flex-basis:100%}.group a{border-color:var(--line);font-size:13px;padding:4px 9px}}
.brand{display:flex;flex-direction:column;gap:4px}
.brand a{font:600 17px var(--display);color:var(--ink);text-decoration:none;letter-spacing:-.01em}
.brand span{color:var(--muted);font-size:13px}
.beads{display:flex;gap:3px}
.beads i{width:9px;height:9px;border-radius:50%;background:var(--accent);display:block}
.beads i:nth-child(2){background:var(--bead)}.beads i:nth-child(3){background:var(--ink)}.beads i:nth-child(4){background:var(--line)}
.group{display:flex;flex-direction:column;gap:2px}
.group h2{font:600 11px var(--body);text-transform:uppercase;letter-spacing:.09em;color:var(--muted);margin:0 0 4px}
.group a{color:var(--ink);text-decoration:none;padding:5px 9px;border-radius:7px;font-size:14px;border:1px solid transparent}
.group a:hover{border-color:var(--line)}
.group a[aria-current="page"]{background:var(--accent);color:var(--accent-ink);font-weight:600}
.back{font-size:13px;color:var(--accent);text-decoration:none}
main{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:clamp(18px,4vw,40px);min-width:0}
article{max-width:72ch}
article h1{font:600 clamp(22px,3.2vw,30px)/1.2 var(--display);letter-spacing:-.015em;margin:0 0 18px;text-wrap:balance}
article h2{font-size:19px;margin:34px 0 10px;text-wrap:balance}
article h3{font-size:16px;margin:24px 0 8px}
article p,article li{margin:0 0 10px}
article ul,article ol{padding-left:22px;margin:0 0 14px}
article a{color:var(--accent)}
article code{font:13px var(--mono);background:var(--code);padding:1px 5px;border-radius:5px;overflow-wrap:anywhere}
article pre{background:var(--code);padding:14px 16px;border-radius:9px;overflow-x:auto;margin:0 0 16px}
article pre code{padding:0;background:none;font-size:12.5px;line-height:1.55;overflow-wrap:normal;white-space:pre}
.tbl{overflow-x:auto;margin:0 0 18px;border:1px solid var(--line);border-radius:9px}
article table{border-collapse:collapse;width:100%;font-size:13.5px;font-variant-numeric:tabular-nums}
article th{text-align:left;font-weight:600;background:var(--soft);color:var(--ink)}
article th,article td{padding:7px 10px;border-bottom:1px solid var(--line);vertical-align:top}
article tr:last-child td{border-bottom:none}
.err{color:var(--muted)}
a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
</style>
</head>
<body>
<div class="wrap">
  <nav aria-label="Документы">
    <div class="brand">
      <div class="beads" aria-hidden="true"><i></i><i></i><i></i><i></i></div>
      <a href="#user-guide">SUP-мозаика</a>
      <span>Документация проекта</span>
    </div>
    <a class="back" href="index.html">← К приложению</a>
    <div class="group" id="g-user"><h2>Документация</h2></div>
  </nav>
  <main><article id="doc"><p class="err">Загружаю документ…</p></article></main>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/marked/18.1.1/lib/marked.umd.min.js" integrity="sha384-7sjOQLpS2mL+qbjUOYVEk350vVNi+nPTKMQFruUWMDTzgcxzTJiwye3rHDJCJ9ZL" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/dompurify/3.4.17/purify.min.js" integrity="sha384-P0JNneQf81HOl9VwNXK76cQ9VMD6Nfsnepxb0cCOg8+UzEdzgPHAPV4wVQrvYQSx" crossorigin="anonymous" referrerpolicy="no-referrer"></script>
<script>
"use strict";
/* Просмотр Markdown-документации проекта: id в адресе (#user-guide) ↔ файл; ссылки на .md открываются здесь же. */
const DOCS=[
  {id:"user-guide",file:"docs/user-guide.md",title:"Руководство",group:"g-user"},
  {id:"keychains",file:"docs/keychains.md",title:"Правила брелока",group:"g-user"},
  {id:"colors",file:"docs/colors.md",title:"Цвета",group:"g-user"}];
const byFile=Object.fromEntries(DOCS.map(d=>[d.file,d])),byId=Object.fromEntries(DOCS.map(d=>[d.id,d]));
for(const d of DOCS){const a=document.createElement("a");a.href="#"+d.id;a.textContent=d.title;a.dataset.id=d.id;document.getElementById(d.group).append(a)}
function resolve(base,href){const parts=base.split("/").slice(0,-1);for(const p of href.split("/")){if(p==="..")parts.pop();else if(p&&p!==".")parts.push(p)}return parts.join("/")}
async function show(id){const d=Object.hasOwn(byId,id)?byId[id]:DOCS[0],el=document.getElementById("doc");
  document.querySelectorAll("nav .group a").forEach(a=>a.toggleAttribute("aria-current",a.dataset.id===d.id)&&a.setAttribute("aria-current","page"));
  try{const r=await fetch(d.file,{cache:"no-cache"});if(!r.ok)throw new Error(r.status);
    el.innerHTML=DOMPurify.sanitize(marked.parse(await r.text()),{FORBID_TAGS:["style","form","input","button","textarea","select"],FORBID_ATTR:["style"]});
    el.querySelectorAll("table").forEach(t=>{const w=document.createElement("div");w.className="tbl";t.replaceWith(w);w.append(t)});
    el.querySelectorAll("a[href]").forEach(a=>{const h=a.getAttribute("href");if(/^[a-z][a-z0-9+.-]*:/i.test(h)&&!/^(https?|mailto):/i.test(h)){a.removeAttribute("href");return}
      if(/^https?:/i.test(h)){a.target="_blank";a.rel="noopener";return}
      const f=resolve(d.file,h.split("#")[0]);if(Object.hasOwn(byFile,f))a.href="#"+byFile[f].id});
    document.title=d.title+" · SUP-мозаика";window.scrollTo(0,0)}
  catch(e){el.innerHTML="";const p=document.createElement("p");p.className="err";p.textContent="Не удалось открыть "+d.file+". Обновите страницу.";el.append(p)}}
window.addEventListener("hashchange",()=>show(location.hash.slice(1)));
show(location.hash.slice(1));
</script>
</body>
</html>
